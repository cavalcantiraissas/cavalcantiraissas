name: atualizar gráficos do perfil

on:
  schedule:
    - cron: "30 6 * * *"   # todo dia, 03:30 em Brasília
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - scripts/gerar_graficos.py
      - .github/workflows/graficos.yml

permissions:
  contents: write

jobs:
  graficos:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: gerar os SVGs a partir da API do GitHub
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/gerar_graficos.py

      - name: salvar se algo mudou
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets
          git diff --cached --quiet && echo "nada mudou" && exit 0
          git commit -m "Atualiza os gráficos do perfil"
          git push
